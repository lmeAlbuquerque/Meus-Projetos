project_id = "arame-run"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://localhost:4173"]
enable_signup = false

[auth.email]
enable_signup = false

[functions.public-registration]
verify_jwt = false

[functions.registration-lookup]
verify_jwt = false

[functions.admin-invite]
verify_jwt = false

[functions.rotate-registration-link]
verify_jwt = false

[functions.registration-private-links]
verify_jwt = false
